<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0f172a 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #e8e8e8;
    overflow: hidden;
    touch-action: manipulation;
}
.game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px;
    max-width: 500px;
    width: 100%;
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 400px;
}
.header h1 {
    font-size: 24px;
    background: linear-gradient(135deg, #34d399, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
}
.scores {
    display: flex;
    gap: 20px;
    font-size: 14px;
}
.scores span { color: #a1a1aa; }
.scores .val { color: #e8e8e8; font-weight: 600; }
canvas {
    display: block;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1;
}
.controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}
.controls-row {
    display: flex;
    gap: 6px;
}
.ctrl-btn {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: #e8e8e8;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    transition: all 0.15s ease;
}
.ctrl-btn:active { background: rgba(255,255,255,0.1); transform: scale(0.95); }
.ctrl-btn.action {
    background: rgba(99,102,241,0.15);
    border-color: rgba(99,102,241,0.3);
    width: 80px;
    height: 44px;
    font-size: 14px;
}
.overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(20px);
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; border-radius: 12px; z-index: 10;
}
.overlay h2 { font-size: 28px; margin-bottom: 12px; }
.overlay p { color: #a1a1aa; margin-bottom: 20px; font-size: 14px; }
.overlay .btn {
    padding: 12px 32px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; font-size: 16px; cursor: pointer; font-weight: 600;
    transition: transform 0.2s ease;
}
.overlay .btn:active { transform: scale(0.95); }
.game-board { position: relative; width: 100%; max-width: 400px; }
@media (max-width: 480px) {
    .game-container { padding: 12px; gap: 10px; }
    .header h1 { font-size: 20px; }
    .scores { font-size: 12px; gap: 12px; }
    .ctrl-btn { width: 50px; height: 50px; font-size: 20px; }
    .ctrl-btn.action { width: 70px; height: 40px; font-size: 12px; }
    .controls { display: flex; }
}
@media (min-width: 481px) { .controls { display: none; } }
</style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <h1>贪吃蛇</h1>
        <div class="scores">
            <div>得分 <span class="val" id="score">0</span></div>
            <div>最高 <span class="val" id="highScore">0</span></div>
        </div>
    </div>
    <div class="game-board">
        <canvas id="game" width="400" height="400"></canvas>
        <div class="overlay" id="overlay">
            <h2>贪吃蛇</h2>
            <p>按开始键开始游戏</p>
            <button class="btn" id="startBtn">开始游戏</button>
        </div>
    </div>
    <div class="controls" id="mobileControls">
        <div class="controls-row">
            <div style="width:50px"></div>
            <button class="ctrl-btn" data-dir="up">↑</button>
            <div style="width:50px"></div>
        </div>
        <div class="controls-row">
            <button class="ctrl-btn" data-dir="left">←</button>
            <button class="ctrl-btn action" id="restartBtn">重新开始</button>
            <button class="ctrl-btn" data-dir="right">→</button>
        </div>
        <div class="controls-row">
            <div style="width:50px"></div>
            <button class="ctrl-btn" data-dir="down">↓</button>
            <div style="width:50px"></div>
        </div>
    </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const GRID = 20;
const COLS = 20;
const ROWS = 20;
const CELL = canvas.width / GRID;

let snake, direction, nextDirection, food, score, highScore, gameLoop, running, speed;

function init() {
    snake = [{x:10, y:10}];
    direction = {x:1, y:0};
    nextDirection = {x:1, y:0};
    score = 0;
    running = false;
    speed = 200;
    highScore = parseInt(localStorage.getItem('snake-high')) || 0;
    highScoreEl.textContent = highScore;
    spawnFood();
    draw();
    overlay.style.display = 'flex';
    overlay.querySelector('h2').textContent = '贪吃蛇';
    overlay.querySelector('p').textContent = '按开始键开始游戏';
    startBtn.textContent = '开始游戏';
}

function spawnFood() {
    let pos;
    do {
        pos = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(canvas.width, i*CELL); ctx.stroke();
    }
    // Snake
    snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length * 0.4;
        const g = Math.round(150 * ratio);
        const b = Math.round(255 * ratio);
        ctx.fillStyle = `rgb(50, ${g}, ${b})`;
        const pad = 1;
        ctx.beginPath();
        ctx.roundRect(seg.x*CELL+pad, seg.y*CELL+pad, CELL-pad*2, CELL-pad*2, 4);
        ctx.fill();
    });
    // Food
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(248,113,113,0.3)';
    ctx.beginPath();
    ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2, 0, Math.PI*2);
    ctx.fill();
}

function update() {
    direction = {...nextDirection};
    const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver(); return;
    }
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver(); return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        speed = Math.max(60, 200 - Math.floor(score / 50) * 15);
        spawnFood();
        clearInterval(gameLoop);
        gameLoop = setInterval(tick, speed);
    } else {
        snake.pop();
    }
    draw();
}

function tick() { if (running) update(); }

function gameOver() {
    running = false;
    clearInterval(gameLoop);
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake-high', highScore);
        highScoreEl.textContent = highScore;
    }
    overlay.style.display = 'flex';
    overlay.querySelector('h2').textContent = '游戏结束';
    overlay.querySelector('p').textContent = '得分: ' + score;
    startBtn.textContent = '再来一局';
}

function startGame() {
    snake = [{x:10, y:10}];
    direction = {x:1, y:0};
    nextDirection = {x:1, y:0};
    score = 0;
    speed = 200;
    scoreEl.textContent = '0';
    running = true;
    overlay.style.display = 'none';
    spawnFood();
    draw();
    clearInterval(gameLoop);
    gameLoop = setInterval(tick, speed);
}

// Keyboard
document.addEventListener('keydown', e => {
    if (!running) return;
    const k = e.key;
    if (k === 'ArrowUp' && direction.y !== 1) nextDirection = {x:0, y:-1};
    else if (k === 'ArrowDown' && direction.y !== -1) nextDirection = {x:0, y:1};
    else if (k === 'ArrowLeft' && direction.x !== 1) nextDirection = {x:-1, y:0};
    else if (k === 'ArrowRight' && direction.x !== -1) nextDirection = {x:1, y:0};
    e.preventDefault();
});

// Mobile controls
document.querySelectorAll('.ctrl-btn[data-dir]').forEach(btn => {
    btn.addEventListener('click', () => {
        if (!running) return;
        const d = btn.dataset.dir;
        if (d === 'up' && direction.y !== 1) nextDirection = {x:0, y:-1};
        else if (d === 'down' && direction.y !== -1) nextDirection = {x:0, y:1};
        else if (d === 'left' && direction.x !== 1) nextDirection = {x:-1, y:0};
        else if (d === 'right' && direction.x !== -1) nextDirection = {x:1, y:0};
    });
});

// Touch swipe
let touchStart = null;
canvas.addEventListener('touchstart', e => {
    touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
});
canvas.addEventListener('touchend', e => {
    if (!touchStart || !running) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (adx > ady && adx > 30) {
        if (dx > 0 && direction.x !== -1) nextDirection = {x:1, y:0};
        else if (dx < 0 && direction.x !== 1) nextDirection = {x:-1, y:0};
    } else if (ady > 30) {
        if (dy > 0 && direction.y !== -1) nextDirection = {x:0, y:1};
        else if (dy < 0 && direction.y !== 1) nextDirection = {x:0, y:-1};
    }
    touchStart = null;
});

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

init();
</script>
</body>
</html>
